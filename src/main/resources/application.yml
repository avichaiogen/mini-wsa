spring:
  application:
    name: mini-wsa
  datasource:
    # Values read from environment variables; defaults match the README setup guide.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/miniwsa}
    username: ${DB_USERNAME:miniwsa}
    password: ${DB_PASSWORD:miniwsa}
  jpa:
    hibernate:
      # "validate": Hibernate checks the DB schema matches the entities but never changes it.
      # Flyway is responsible for all DDL — Hibernate only reads.
      ddl-auto: validate
    # open-in-view: false prevents the anti-pattern of lazy-loading DB data inside the HTTP response
    # rendering phase, which holds a DB connection open for the full request lifecycle.
    open-in-view: false
  flyway:
    # Flyway runs on startup before Hibernate validation, applying any pending migrations.
    enabled: true

  jackson:
    # Allow POST body to be either a single object {...} or an array [{...}].
    # IngestionController always binds to List<EventRequest>; this makes both work.
    deserialization:
      ACCEPT_SINGLE_VALUE_AS_ARRAY: true
    # Serialize Instant as ISO-8601 string ("2026-05-20T14:32:10Z"), not epoch millis.
    # In Jackson 3 (Spring Boot 4), WRITE_DATES_AS_TIMESTAMPS moved from SerializationFeature to DateTimeFeature.
    datatype:
      datetime:
        WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: 8080
